name: system_hr
description: Offline HR Management System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2

  # PDF / Print
  pdf: ^3.11.1
  printing: ^5.13.2

  # Charts
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.19.0
  file_picker: ^8.1.4
  uuid: ^4.5.1
  equatable: ^2.0.7
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.22.0
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/fonts/lao/

  fonts:
    - family: PhetsarathOT
      fonts:
        - asset: assets/fonts/Phetsarath OT.ttf
